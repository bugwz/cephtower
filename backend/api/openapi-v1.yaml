      properties:
        bucket_id: {type: string}
        kind: {type: string, enum: [policy, cors, lifecycle, encryption, versioning, tagging, object-lock, acl, replication, notification]}
        configured: {type: boolean}
        document: {type: string, nullable: true}
        content_type: {type: string, nullable: true}
        versioning:
          type: object
          additionalProperties: false
          required: [status, mfa_delete]
          properties:
            status: {type: string, enum: ['', Enabled, Suspended]}
            mfa_delete: {type: string, nullable: true, enum: [Enabled, Disabled, null]}
        notifications:
          type: array
          description: Native notification rules; an empty array is a successful empty configuration, not a read failure.
          items:
            type: object
            additionalProperties: false
            required: [id, topic, events, filters]
            properties:
              id: {type: string}
              topic: {type: string}
              events:
                type: array
                items: {type: string}
              filters:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [kind, name, value]
                  properties:
                    kind: {type: string, enum: [S3Key, S3Metadata, S3Tags]}
                    name: {type: string}
                    value: {type: string}
        replication:
          type: object
          nullable: true
          additionalProperties: false
          required: [role, rules]
          properties:
            role: {type: string}
            rules:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id, status, priority, destination_bucket]
                properties:
                  id: {type: string}
                  status: {type: string}
                  priority: {type: string, nullable: true}
                  destination_bucket: {type: string}
        acl:
          type: object
          additionalProperties: false
          required: [owner, grants]
          properties:
            owner:
              type: object
              additionalProperties: false
              required: [id, display_name]
              properties:
                id: {type: string}
                display_name: {type: string}
            grants:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [grantee, permissions]
                properties:
                  grantee:
                    type: object
                    additionalProperties: false
                    required: [type, id, display_name, uri, email_address]
                    properties:
                      type: {type: string}
                      id: {type: string}
                      display_name: {type: string}
                      uri: {type: string}
                      email_address: {type: string}
                  permissions:
                    type: array
                    items: {type: string}
        object_lock:
          type: object
          nullable: true
          additionalProperties: false
          required: [enabled, default_retention]
          properties:
            enabled: {type: boolean}
            default_retention:
              type: object
              nullable: true
              additionalProperties: false
              required: [mode, days, years]
              properties:
                mode: {type: string}
                days: {type: string, nullable: true}
                years: {type: string, nullable: true}
        lifecycle_rules:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, status, selector, actions]
            properties:
              id: {type: string}
              status: {type: string, enum: [Enabled, Disabled]}
              selector:
                type: object
                additionalProperties: false
                required: [kind, and, prefix, tags, object_size_greater_than, object_size_less_than, archive_zone]
                properties:
                  kind: {type: string, enum: [Prefix, Filter]}
                  and: {type: boolean}
                  prefix: {type: string, nullable: true}
                  tags:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [key, value]
                      properties:
                        key: {type: string}
                        value: {type: string}
                  object_size_greater_than: {type: string, nullable: true}
                  object_size_less_than: {type: string, nullable: true}
                  archive_zone: {type: boolean}
              actions:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [type, fields]
                  properties:
                    type: {type: string, enum: [Expiration, NoncurrentVersionExpiration, AbortIncompleteMultipartUpload, Transition, NoncurrentVersionTransition]}
                    fields:
                      type: object
                      additionalProperties: {type: string}
        cors_rules:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, allowed_origins, allowed_methods, allowed_headers, expose_headers, max_age_seconds]
            properties:
              id: {type: string}
              allowed_origins: {type: array, items: {type: string}}
              allowed_methods: {type: array, items: {type: string}}
              allowed_headers: {type: array, items: {type: string}}
              expose_headers: {type: array, items: {type: string}}
              max_age_seconds: {type: integer, minimum: 0, maximum: 4294967294, nullable: true}
        encryption:
          type: object
          nullable: true
          additionalProperties: false
          required: [rule_exists, algorithm, kms_master_key_id, bucket_key_enabled]
          properties:
            rule_exists: {type: boolean}
            algorithm: {type: string}
            kms_master_key_id: {type: string}
            bucket_key_enabled: {type: boolean}
        tags:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [key, value]
            properties:
              key: {type: string}
              value: {type: string}
