components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    APIResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          type: integer
          const: 0
        message:
          type: string
        data:
          $ref: '#/components/schemas/JSONValue'
    JSONValue:
      oneOf:
        - type: object
          additionalProperties:
            $ref: '#/components/schemas/JSONValue'
        - type: array
          items:
            $ref: '#/components/schemas/JSONValue'
        - type: string
        - type: number
        - type: boolean
        - type: 'null'
    ErrorData:
      type: object
      additionalProperties: false
      required: [error_code, retryable, request_id]
      properties:
        error_code:
          type: string
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/JSONValue'
        request_id:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          type: integer
          minimum: 400
        message:
          type: string
        data:
          $ref: '#/components/schemas/ErrorData'
    ClusterCreateRequest:
      type: object
      additionalProperties: false
      required: [name, monitor_addresses, client_username, client_key]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        monitor_addresses: {type: string, minLength: 1, maxLength: 4096}
        client_username: {type: string, pattern: '^client\\.'}
        client_key: {type: string, writeOnly: true, minLength: 1}
    ActionResult:
      type: object
      additionalProperties: false
      properties:
        resource_url: {type: string}
        details: {$ref: '#/components/schemas/JSONValue'}
    Operation:
      type: object
      additionalProperties: false
      required: [operation_id, cluster_id, request_id, action, resource_kind, resource_key, risk, status, retryable, attempts, max_attempts, created_at, updated_at]
      properties:
        operation_id: {type: integer, minimum: 1}
        cluster_id: {type: integer, minimum: 1}
        request_id: {type: string}
        action: {type: string}
        resource_kind: {type: string}
        resource_key: {type: string}
        risk: {type: string}
        status: {type: string, enum: [queued, running, succeeded, failed]}
        expected_version: {type: integer, minimum: 0}
        result: {$ref: '#/components/schemas/ActionResult'}
        error_code: {type: string}
        error_message: {type: string}
        retryable: {type: boolean}
        attempts: {type: integer, minimum: 0}
        max_attempts: {type: integer, minimum: 1}
        next_attempt_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ObservationHistory:
      type: object
      additionalProperties: false
      required: [observation_id, kind, natural_key, source, observed_at, data]
      properties:
        observation_id: {type: integer, minimum: 1}
        kind: {type: string, enum: [overview, health_check]}
        natural_key: {type: string}
        status: {type: string}
        source: {type: string}
        source_version: {type: string}
        observed_at: {type: string, format: date-time}
        data: {$ref: '#/components/schemas/JSONValue'}
    Pagination:
      type: object
      additionalProperties: false
      required: [next_cursor]
      properties:
        next_cursor: {type: [string, 'null']}
    Meta:
      type: object
      additionalProperties: false
      properties:
        request_id: {type: string}
        observed_at: {type: [string, 'null'], format: date-time}
        stale: {type: boolean}
        stale_reason: {type: [string, 'null']}
    HealthData:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [ok, ready]}
    BootstrapData:
      type: object
      additionalProperties: false
      required: [required]
      properties:
        required: {type: boolean}
    User:
      type: object
      additionalProperties: false
      required: [id, username, display_name, email, status, last_login_at, created_at, updated_at]
      properties:
        id: {type: integer, minimum: 1}
        username: {type: string}
        display_name: {type: string}
        email: {type: [string, 'null']}
        status: {type: string}
        last_login_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    LoginData:
      type: object
      additionalProperties: false
      required: [token, expires_at, user]
      properties:
