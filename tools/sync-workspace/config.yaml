# 含义：目标机器 SSH 地址，可以是公网 IP、内网 IP 或可解析主机名。
# 可选值：任意可 SSH 连接的地址，或空字符串 "" 让工具从 tools/aliyun-ceph-lab/.state/*.json 中选择机器。
# 默认值：""。
host: ""
# 含义：目标机器 SSH 端口。
# 可选值：1-65535 的端口号。
# 默认值：22。
port: 22
# 含义：目标机器 SSH 登录用户；非 root 时工具会尝试通过 sudo 执行同步、构建和服务管理命令。
# 可选值：具有 /root/cephtower 写入权限或免密 sudo 权限的用户。
# 默认值："root"。
user: "root"
# 含义：目标机器 SSH 登录密码。
# 可选值：目标用户的有效密码；host 为空时会从 aliyun-ceph-lab 状态文件读取。
# 默认值：""。
password: ""
# 含义：工作区同步工具记录和校验远端 SSH 主机密钥的本地文件。
# 可选值：绝对路径，或相对于本配置文件所在目录的路径。
# 默认值：".state/known_hosts"。
known_hosts: ".state/known_hosts"

# 含义：run 启动时是否清空一次 /root/cephtower/app；自动重启不会重复清理。
# 可选值：true（清空）或 false（保留）。
# 默认值：false。
clean_on_start: false
